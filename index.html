<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIKA AI - Groq Ultra Edition</title>
<style>
:root{--neon-cyan:#00ffff;--neon-blue:#0088ff;--dark-bg:#030712;--card-bg:rgba(0,255,255,.04);--border-glow:rgba(0,255,255,.3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:0;background:var(--dark-bg);color:var(--neon-cyan);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow-x:hidden}
.container{text-align:center;width:92%;max-width:390px;padding:15px 0 30px}
h1{font-size:24px;letter-spacing:4px;margin:5px 0 2px;text-shadow:0 0 15px var(--neon-cyan),0 0 30px var(--neon-blue);background:linear-gradient(45deg,#00ffff,#88ccff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.clickable-i{cursor:pointer;transition:.3s;display:inline-block}
.clickable-i:hover{color:#ff00ff;text-shadow:0 0 12px #ff00ff;transform:scale(1.2)}
.subtitle{color:#66b3ff;font-size:11px;margin-bottom:15px;letter-spacing:1px}
.reactor-btn{position:relative;width:95px;height:95px;background:radial-gradient(circle,#00ffff 0%,#004466 70%,#020b14 100%);border-radius:50%;border:3px solid var(--neon-cyan);box-shadow:0 0 20px var(--neon-cyan),inset 0 0 15px var(--neon-cyan);cursor:pointer;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;transition:transform .12s,background .3s;animation:pulse 2s infinite;touch-action:manipulation;user-select:none}
.reactor-btn:active{transform:scale(.92)}
.reactor-btn::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:3px solid #fff;opacity:0;pointer-events:none}
.reactor-btn.ping::after{animation:ring .65s ease-out}
.reactor-btn.listening{background:radial-gradient(circle,#ff00ff 0%,#660066 70%,#020b14 100%);border-color:#ff00ff;box-shadow:0 0 30px #ff00ff,inset 0 0 20px #ff00ff;animation:fast-pulse .8s infinite}
.reactor-btn.processing{background:radial-gradient(circle,#ffcc00 0%,#664400 70%,#020b14 100%);border-color:#ffcc00;box-shadow:0 0 25px #ffcc00,inset 0 0 15px #ffcc00;animation:fast-pulse 1.2s infinite}
.reactor-btn span{color:#020b14;font-weight:900;font-size:12px;letter-spacing:1px;pointer-events:none}
.status-line{font-size:10px;color:#66b3ff;min-height:14px;margin-bottom:10px;letter-spacing:.5px}
@keyframes ring{0%{transform:scale(1);opacity:.95}100%{transform:scale(1.8);opacity:0}}
@keyframes pulse{0%,100%{box-shadow:0 0 15px var(--neon-cyan),inset 0 0 8px var(--neon-cyan)}50%{box-shadow:0 0 30px var(--neon-cyan),inset 0 0 18px var(--neon-cyan)}}
@keyframes fast-pulse{0%,100%{box-shadow:0 0 20px currentColor,inset 0 0 10px currentColor}50%{box-shadow:0 0 40px currentColor,inset 0 0 25px currentColor}}
.reactor-btn.listening{color:#ff00ff}.reactor-btn.processing{color:#ffcc00}
.output-card{background:var(--card-bg);border:1px solid var(--border-glow);border-radius:12px;margin-bottom:10px;box-shadow:inset 0 0 12px rgba(0,255,255,.08);text-align:left;color:#e0ffff;display:flex;flex-direction:column;overflow:hidden}
.output-body{padding:10px 12px 6px;min-height:46px;max-height:96px;overflow-y:auto;font-size:12px;line-height:1.4;word-break:break-word;white-space:pre-wrap}
.output-body a{color:#ff88ff;font-weight:bold}
.output-tools{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 8px 6px;border-top:1px dashed rgba(0,255,255,.18)}
.tts-state{font-size:10px;color:#66b3ff;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-speak-btn{flex-shrink:0;background:rgba(0,255,255,.14);color:var(--neon-cyan);border:1px solid var(--neon-cyan);border-radius:6px;padding:3px 9px;font-size:10px;font-weight:bold;cursor:pointer;line-height:1.2}
.mini-speak-btn:hover,.mini-speak-btn:active{background:var(--neon-cyan);color:#030712}
.chat-bar{display:flex;gap:6px;margin-bottom:12px}
.tabs{display:flex;justify-content:space-between;background:rgba(0,255,255,.05);border:1px solid var(--border-glow);border-radius:10px;padding:4px;margin-bottom:12px;gap:2px}
.tab-btn{background:none;border:none;color:#88ccff;font-size:9px;cursor:pointer;padding:5px 1px;border-radius:6px;transition:.2s;font-weight:bold;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1;white-space:nowrap}
.tab-btn .ic{font-size:15px;line-height:1}
.tab-btn.active,.tab-btn:hover{background:var(--neon-cyan);color:#030712;box-shadow:0 0 10px var(--neon-cyan)}
.panel{display:none;background:var(--card-bg);border:1px solid var(--border-glow);border-radius:12px;padding:10px;margin-bottom:12px;text-align:left;max-height:130px;overflow-y:auto}
.panel.active{display:block}
#visionTab{max-height:none}
.panel-title{font-size:11px;color:var(--neon-cyan);margin-bottom:6px;border-bottom:1px solid rgba(0,255,255,.2);padding-bottom:3px;display:flex;justify-content:space-between;align-items:center}
.item-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:4px 0;border-bottom:1px dashed rgba(0,255,255,.1);color:#d0ffff;gap:6px;word-break:break-word}
.action-btns{display:flex;flex-shrink:0}
.action-btns button{background:none;border:none;cursor:pointer;font-size:10px;margin-left:4px;padding:2px 5px;border-radius:4px}
.btn-del{color:#ff4444;background:rgba(255,68,68,.1)}
.btn-edit{color:#00ffff;background:rgba(0,255,255,.1)}
.input-group{display:flex;gap:6px;margin-top:6px}
input[type=text],input[type=password]{background:#02050a;border:1px solid var(--neon-cyan);color:var(--neon-cyan);padding:6px 8px;border-radius:6px;flex:1;min-width:0;font-size:11px;outline:none}
input::placeholder{color:rgba(0,255,255,.4)}
.cyber-btn{background:var(--neon-cyan);color:#030712;border:none;padding:6px 10px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:11px;box-shadow:0 0 8px rgba(0,255,255,.4);transition:.2s;white-space:nowrap;flex-shrink:0}
.cyber-btn:hover{background:#88ffff;box-shadow:0 0 15px var(--neon-cyan)}
.cyber-btn:disabled{opacity:.5;cursor:wait}
.vision-actions{display:flex;gap:6px;margin-top:6px}
.vision-actions .cyber-btn{flex:1;text-align:center;padding:8px 6px}
.pick-btn{background:transparent;color:var(--neon-cyan);border:1px dashed var(--neon-cyan);box-shadow:none}
.remove-btn{background:rgba(255,68,68,.15);color:#ff5555;border:1px solid #ff4444;box-shadow:none;display:none}
#imageInput{display:none}
.preview-box{margin-top:8px;display:none;border:1px solid var(--border-glow);border-radius:8px;overflow:hidden;background:#02050a}
.preview-box img{display:block;width:100%;max-height:150px;object-fit:contain}
.vision-hint{font-size:10px;color:#66b3ff;margin-top:6px;word-break:break-word}
</style>

<body>
<div class="container">
  <h1>R<span onclick="verifyAndOpenSettings()" class="clickable-i">i</span>KA</h1>
  <div class="subtitle">✨ Groq Ultra Edition ✨</div>

  <div class="reactor-btn" id="speakBtn" onpointerdown="pingTalk()" onclick="handleTalkClick()"><span id="btnText">TALK</span></div>
  <div class="status-line" id="statusLine">टैप करके बोलें</div>

  <div class="output-card">
    <div class="output-body" id="output">System Online (Groq). Tap 'TALK' or type below...</div>
    <div class="output-tools">

    <button class="tab-btn" onclick="switchTab('historyTab',this)"><span class="ic">📜</span>History</button>
    <button class="tab-btn" onclick="switchTab('visionTab',this)"><span class="ic">📷</span>Vision</button>
  </div>

  <div id="calcTab" class="panel active">
    <div class="panel-title"><span>🧮 Live Calculator</span></div>
    <div class="input-group">

  <div id="notesTab" class="panel">
    <div class="panel-title"><span>📝 Notes</span></div>
    <div id="notesList"></div>
    <div class="input-group" style="margin-top:8px">
      <input type="text" id="manualNote" placeholder="Type a new note...">
      <button class="cyber-btn" onclick="addManualNote()">Add Note</button>
    </div>
  </div>

  <div id="alarmTab" class="panel">
    <div class="panel-title"><span>⏰ Active Alarms & Reminders</span></div>
    <div id="alarmsList"></div>
    <div class="input-group" style="margin-top:8px">
      <input type="text" id="manualAlarm" placeholder="e.g. 20:00 or 2 min">
      <button class="cyber-btn" onclick="addManualAlarm()">Set Alarm</button>
    </div>
  </div>

  <div id="historyTab" class="panel">
    <div class="panel-title"><span>📜 Conversation History</span><button onclick="clearHistory()" style="background:none;border:none;color:#ff4444;font-size:9px;cursor:pointer">Clear</button></div>
    <div id="historyList"></div>
  </div>

  <div id="visionTab" class="panel">
    <div class="panel-title"><span>📷 Image Vision Scanner</span></div>
    <input type="file" id="imageInput" accept="image/*" onchange="previewImage()">
    <div class="vision-actions">
      <label for="imageInput" class="cyber-btn pick-btn" id="pickLabel">🖼️ गैलरी से चुनें</label>
      <button class="cyber-btn remove-btn" id="removeImgBtn" onclick="clearImage()">❌ Remove</button>
      <button class="cyber-btn" id="scanBtn" onclick="analyzeImage()">🔍 Scan Img</button>
    </div>
    <div class="input-group">
      <input type="text" id="visionPrompt" placeholder="फोटो के बारे में कुछ पूछें (वैकल्पिक)...">
    </div>
    <div class="preview-box" id="previewBox"><img id="previewImg" alt="preview"></div>
    <div class="vision-hint" id="visionHint">फोटो चुनें, फिर Scan Img दबाएं।</div>
  </div>

  <div id="settingsTab" class="panel">
    <div class="panel-title"><span>⚙️ Groq API Configuration</span></div>
    <div class="input-group">
      <input type="password" id="apiKey" placeholder="Enter Groq API Key">

    </div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAqXq8yoWivd8lDuZbqyrLh48UOLDBFDPA",
  authDomain: "rika-f12be.firebaseapp.com",
  projectId: "rika-f12be",
  storageBucket: "rika-f12be.firebasestorage.app",
  messagingSenderId: "574172035095",
  appId: "1:574172035095:web:42c15d4d2109d941638452",
  measurementId: "G-REQ6GDGZ4F"
};
try { firebase.initializeApp(firebaseConfig); firebase.analytics(); } catch (e) {}

const output = document.getElementById('output');
const speakBtn = document.getElementById('speakBtn');
const btnText = document.getElementById('btnText');
const statusLine = document.getElementById('statusLine');
const ttsStateEl = document.getElementById('ttsState');
const repeatBtn = document.getElementById('repeatBtn');

const GROQ_MODELS = ["openai/gpt-oss-120b", "qwen/qwen3.6-27b", "openai/gpt-oss-20b"];
const VISION_MODELS = ["qwen/qwen3.8-27b", "qwen/qwen3.6-27b"];
const STT_MODELS = ["whisper-large-v3-turbo", "whisper-large-v3"];

let GROQ_API_KEY = localStorage.getItem('rika_groq_key') || "";
let userNotes = JSON.parse(localStorage.getItem('rika_notes') || "[]");
let userAlarms = JSON.parse(localStorage.getItem('rika_alarms') || "[]");
let chatHistory = JSON.parse(localStorage.getItem('rika_history') || "[]");
let userLiveLocation = "Fetching location...";
let lastSpokenText = "";

/* =====================  TTS ENGINE  =====================
   Order: native Android bridge (if APK has one) -> speechSynthesis (only if it
   really starts) -> online Google TTS played through a single unlocked <audio>. */
const TTS = { audio: new Audio(), unlocked: false, token: 0, state: 'idle', watchdog: null, cur: null };

function makeSilentWav() {
  const n = 800, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true); v.setUint32(28, 16000, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
const SILENT_URL = makeSilentWav();

function unlockAudio() {
  if (TTS.unlocked || TTS.state === 'speaking') return;
  try {
    TTS.audio.src = SILENT_URL;
    const p = TTS.audio.play();
    if (p && p.then) p.then(() => { TTS.unlocked = true; }).catch(() => {});
    else TTS.unlocked = true;
  } catch (e) {}
}
['pointerdown', 'touchstart', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, unlockAudio, { passive: true }));

function cleanSpeechText(text) {
  return String(text || '').replace(/[*#_`~]/g, '').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '').replace(/\s+/g, ' ').trim();
}

function chunkText(t, max = 170) {
  const parts = t.match(/[^।.!?\n]+[।.!?]*/g) || [t], out = [];
  let cur = '';
  for (const p0 of parts) {
    const p = p0.trim(); if (!p) continue;
    if ((cur + ' ' + p).trim().length <= max) { cur = (cur + ' ' + p).trim(); continue; }
    if (cur) out.push(cur);
    cur = '';
    if (p.length <= max) { cur = p; continue; }
    let line = '';
    for (const wd of p.split(' ')) {
      if ((line + ' ' + wd).trim().length > max) { out.push(line); line = wd; } else line = (line + ' ' + wd).trim();
    }
    cur = line;
  }
  if (cur) out.push(cur);
  return out;
}

function setTtsStatus(s) {
  TTS.state = s;
  ttsStateEl.innerText = s === 'speaking' ? '🔊 बोल रही हूँ…' : s === 'error' ? '🔇 आवाज़ नहीं चली — 🔊 दबाएँ' : '';
  repeatBtn.innerText = s === 'speaking' ? '⏹ रोकें' : '🔊 सुनें';
}

function nativeBridge() {
  for (const n of ['AndroidTTS', 'Android', 'RikaNative', 'NativeTTS']) {
    const o = window[n];
    if (o && typeof o.speak === 'function') return o;
  }
  return null;
}

function stopSpeaking() {
  TTS.token++;
  clearTimeout(TTS.watchdog);
  try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {}
  try { TTS.audio.onended = TTS.audio.onerror = null; TTS.audio.pause(); } catch (e) {}
  try { const b = nativeBridge(); if (b && typeof b.stop === 'function') b.stop(); } catch (e) {}
  setTtsStatus('idle');
}

function trySynth(chunks, tok, lang, onFail, onDone) {
  if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') return false;
  const voices = window.speechSynthesis.getVoices() || [];
  if (!voices.length) return false;
  const pre = lang === 'hi' ? 'hi' : 'en';
  const voice = voices.find(v => v.lang && v.lang.toLowerCase().replace('_', '-').startsWith(pre));
  if (lang === 'hi' && !voice) return false; // no Hindi voice -> online Hindi voice
  let started = false, failed = false;
  const fail = () => { if (failed || tok !== TTS.token) return; failed = true; try { window.speechSynthesis.cancel(); } catch (e) {} onFail(); };
  TTS.watchdog = setTimeout(() => { if (!started) fail(); }, 2200);
  const at = i => {
    if (tok !== TTS.token || failed) return;
    if (i >= chunks.length) { clearTimeout(TTS.watchdog); onDone(); return; }
    const u = new SpeechSynthesisUtterance(chunks[i]);
    TTS.cur = u;
    if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = lang === 'hi' ? 'hi-IN' : 'en-IN';
    u.onstart = () => { started = true; clearTimeout(TTS.watchdog); };
    u.onend = () => at(i + 1);
    u.onerror = e => {
      if (e && (e.error === 'canceled' || e.error === 'interrupted')) return;
      if (!started) fail(); else at(i + 1);
    };
    window.speechSynthesis.speak(u);
  };
  setTimeout(() => at(0), 60);
  return true;
}

function playOnline(chunks, tok, lang, onDone, onFail) {
  let i = 0;
  const urls = c => {
    const q = encodeURIComponent(c);
    return [`https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=${lang}&q=${q}`,
            `https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=${lang}&q=${q}`];
  };
  const next = () => {
    if (tok !== TTS.token) return;
    if (i >= chunks.length) { onDone(); return; }
    const u = urls(chunks[i]); let k = 0;
    const go = () => {
      if (tok !== TTS.token) return;
      const a = TTS.audio;
      a.onended = () => { i++; next(); };
      a.onerror = () => { if (tok !== TTS.token) return; if (++k < u.length) go(); else onFail(); };
      a.src = u[k];
      const p = a.play();
      if (p && p.catch) p.catch(err => {
        if (tok !== TTS.token || (err && err.name === 'AbortError')) return;
        if (err && err.name === 'NotAllowedError') onFail();
        else if (++k < u.length) go(); else onFail();
      });
    };
    go();
  };
  next();
}

function speak(text) {
  const clean = cleanSpeechText(text);
  if (!clean) return;
  lastSpokenText = clean;
  stopSpeaking();
  const tok = TTS.token;
  setTtsStatus('speaking');
  const done = () => { if (tok === TTS.token) setTtsStatus('idle'); };
  const lang = /[\u0900-\u097F]/.test(clean) ? 'hi' : 'en';
  const chunks = chunkText(clean);

  const b = nativeBridge();
  if (b) {
    try { b.speak(clean); setTimeout(done, Math.min(30000, 1500 + clean.length * 90)); return; } catch (e) {}
  }
  const online = () => {
    if (tok !== TTS.token) return;
    playOnline(chunks, tok, lang, done, () => { if (tok === TTS.token) setTtsStatus('error'); });
  };
  if (!trySynth(chunks, tok, lang, online, done)) online();
}

window.speakLastReply = function () {
  if (TTS.state === 'speaking') { stopSpeaking(); return; }
  const t = lastSpokenText || output.innerText;
  if (t) speak(t);
};

/* =====================  STT / TALK BUTTON  ===================== */
let sttState = 'idle', activeRecognition = null, activeRecorder = null, srBroken = false;

function setTalkState(s) {
  sttState = s;
  speakBtn.classList.remove('listening', 'processing');
  const map = {
    idle: ['TALK', 'टैप करके बोलें'],
    ping: ['PING', 'Mic चेक हो रहा है…'],
    listening: ['LISTEN', '🎤 सुन रही हूँ… रोकने के लिए फिर टैप करें'],
    recording: ['REC', '🔴 रिकॉर्डिंग… चुप होते ही अपने-आप रुकेगी'],
    processing: ['WAIT', '⏳ आवाज़ समझ रही हूँ…']
  };
  btnText.innerText = map[s][0];
  statusLine.innerText = map[s][1];
  if (s === 'listening' || s === 'recording') speakBtn.classList.add('listening');
  if (s === 'processing') speakBtn.classList.add('processing');
}

window.pingTalk = function () {
  speakBtn.classList.remove('ping'); void speakBtn.offsetWidth; speakBtn.classList.add('ping');
  try { if (navigator.vibrate) navigator.vibrate(25); } catch (e) {}
  unlockAudio();
};

window.handleTalkClick = function () {
  stopSpeaking();
  if (sttState === 'listening' || sttState === 'recording') { stopListening(); return; }
  if (sttState === 'processing') return;
  setTalkState('ping');
  output.innerText = "📡 Mic चेक हो रहा है...";
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR && !srBroken) startSR(SR); else startRecorder();
};

function stopListening() {
  try { if (activeRecognition) activeRecognition.stop(); } catch (e) {}
  try { if (activeRecorder && activeRecorder.state !== 'inactive') activeRecorder.stop(); } catch (e) {}
}

function startSR(SR) {
  let finished = false, got = false, startTimer = null;
  const fallback = () => { if (finished) return; finished = true; clearTimeout(startTimer); srBroken = true; activeRecognition = null; startRecorder(); };
  try {
    const rec = new SR();
    activeRecognition = rec;
    rec.lang = 'hi-IN'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
    startTimer = setTimeout(() => { if (sttState === 'ping') { try { rec.abort(); } catch (e) {} fallback(); } }, 2500);
    rec.onstart = () => { clearTimeout(startTimer); setTalkState('listening'); output.innerText = "🎤 सुन रही हूँ..."; };
    rec.onresult = e => {
      let fin = '', interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) fin += r[0].transcript; else interim += r[0].transcript;
      }
      if (interim && !fin) output.innerText = "🎤 " + interim;
      if (fin && !finished) { got = true; finished = true; setTalkState('idle'); runCommand(fin.trim()); }
    };
    rec.onerror = e => {
      if (finished) return;
      if (['not-allowed', 'service-not-allowed', 'network', 'audio-capture', 'language-not-supported'].includes(e.error)) { fallback(); return; }
      finished = true; clearTimeout(startTimer); activeRecognition = null; setTalkState('idle');
      if (e.error === 'no-speech') output.innerText = "कुछ सुनाई नहीं दिया। फिर से TALK दबाएँ।";
      else if (e.error !== 'aborted') output.innerText = "Mic error (" + e.error + "). फिर कोशिश करें या टाइप करें।";
    };
    rec.onend = () => {
      clearTimeout(startTimer); activeRecognition = null;
      if (!finished) { finished = true; if (!got) { setTalkState('idle'); output.innerText = "कुछ सुनाई नहीं दिया। फिर से TALK दबाएँ।"; } }
    };
    rec.start();
  } catch (err) { fallback(); }
}

function micErrorText(e) {
  const n = e && e.name;
  if (n === 'NotAllowedError' || n === 'SecurityError') return "🎙️ Mic permission ब्लॉक है। फ़ोन की App Settings → Permissions → Microphone चालू करें (APK में RECORD_AUDIO permission चाहिए)। तब तक नीचे टाइप करके पूछें।";
  if (n === 'NotFoundError') return "🎙️ कोई माइक्रोफ़ोन नहीं मिला। नीचे टाइप करके पूछें।";
  return "🎙️ माइक शुरू नहीं हो सका (" + (n || 'error') + "). नीचे टाइप करके पूछें।";
}

async function startRecorder() {
  if (!GROQ_API_KEY) { setTalkState('idle'); output.innerText = "इस WebView में सीधा STT नहीं चलता। Voice के लिए Groq API key जोड़ें ('i' दबाएँ) या नीचे टाइप करें।"; return; }
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
    setTalkState('idle');
    output.innerText = "इस WebView में Mic recording उपलब्ध नहीं (https/permission चाहिए)। नीचे टाइप करके पूछें या Chrome में खोलें।";
    return;
  }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
  catch (e) { setTalkState('idle'); output.innerText = micErrorText(e); return; }

  const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'].find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
  let mr;
  try { mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined); }
  catch (e) { stream.getTracks().forEach(t => t.stop()); setTalkState('idle'); output.innerText = micErrorText(e); return; }

  activeRecorder = mr;
  const parts = []; let heard = false, silentSince = 0, timer = null, ctx = null;
  const t0 = Date.now();
  const cleanup = () => { clearInterval(timer); try { if (ctx) ctx.close(); } catch (e) {} stream.getTracks().forEach(t => t.stop()); activeRecorder = null; };

  mr.ondataavailable = e => { if (e.data && e.data.size) parts.push(e.data); };
  mr.onstop = async () => {
    cleanup();
    const blob = new Blob(parts, { type: mr.mimeType || mime || 'audio/webm' });
    if (!heard || blob.size < 1500) { setTalkState('idle'); output.innerText = "कुछ सुनाई नहीं दिया। फिर से TALK दबाएँ।"; return; }
    setTalkState('processing');
    output.innerText = "⏳ आवाज़ को टेक्स्ट में बदल रही हूँ...";
    try {
      const text = await transcribe(blob);
      setTalkState('idle');
      if (text) runCommand(text); else output.innerText = "आवाज़ समझ नहीं आई। फिर कोशिश करें।";
    } catch (e) { setTalkState('idle'); output.innerText = "STT Error: " + e.message; }
  };

  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    if (ctx.resume) ctx.resume();
    const an = ctx.createAnalyser(); an.fftSize = 1024;
    ctx.createMediaStreamSource(stream).connect(an);
    const buf = new Uint8Array(an.fftSize);
    timer = setInterval(() => {
      an.getByteTimeDomainData(buf);
      let s = 0; for (let i = 0; i < buf.length; i++) { const x = (buf[i] - 128) / 128; s += x * x; }
      const rms = Math.sqrt(s / buf.length), now = Date.now();
      if (rms > 0.03) { heard = true; silentSince = 0; } else if (heard && !silentSince) silentSince = now;
      if ((heard && silentSince && now - silentSince > 1400) || now - t0 > 20000 || (!heard && now - t0 > 7000)) stopListening();
    }, 100);
  } catch (e) {
    heard = true; // no analyser: record 8s or until tap
    timer = setInterval(() => { if (Date.now() - t0 > 8000) stopListening(); }, 200);
  }
  mr.start(250);
  setTalkState('recording');
  output.innerText = "🎤 बोलिए... (रिकॉर्डिंग चालू)";
}

async function transcribe(blob) {
  const ext = blob.type.includes('mp4') ? 'mp4' : blob.type.includes('ogg') ? 'ogg' : 'webm';
  let lastErr = "STT failed";
  for (const model of STT_MODELS) {
    try {
      const fd = new FormData();
      fd.append('file', blob, 'speech.' + ext);
      fd.append('model', model); fd.append('language', 'hi'); fd.append('response_format', 'json'); fd.append('temperature', '0');
      const res = await fetch("https://api.groq.com/openai/v1/audio/transcriptions", { method: 'POST', headers: { 'Authorization': `Bearer ${GROQ_API_KEY}` }, body: fd });
      const data = await res.json().catch(() => ({}));
      if (typeof data.text === 'string') return data.text.trim();
      lastErr = (data.error && data.error.message) || lastErr;
    } catch (e) { lastErr = e.message; }
  }
  throw new Error(lastErr);
}

function setAlarmValue(val) {
  const minMatch = val.match(/(\d+)\s*(min|मिनट)/i);
  if (minMatch) {
    const target = new Date(Date.now() + parseInt(minMatch[1]) * 60000);
    val = String(target.getHours()).padStart(2, '0') + ":" + String(target.getMinutes()).padStart(2, '0');
  }
  userAlarms.push(val); save('rika_alarms', userAlarms);
  updateUI();
  return val;
}

window.deleteAlarm = function (i) { userAlarms.splice(i, 1); save('rika_alarms', userAlarms); updateUI(); };

function checkAlarms() {
  if (userAlarms.length === 0) return;
  const now = new Date();
  const currentTime = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');
  const altTime = now.getHours() + ":" + String(now.getMinutes()).padStart(2, '0');
  const fired = userAlarms.filter(a => a.includes(currentTime) || a.includes(altTime));
  if (fired.length === 0) return;
  userAlarms = userAlarms.filter(a => !fired.includes(a));
  save('rika_alarms', userAlarms);
  updateUI();
  fired.forEach(a => {
    output.innerText = `🚨 ALARM RINGING: ${a}`;
    speak("अलार्म बज रहा है! समय हो गया है।");
    alert(`⏰ अलार्म का समय हो गया है: ${a}`);
  });
}

function tryAutomation(text) {
  const t = text.trim();
  const playWords = "चलाओ|चला दो|चला दे|बजाओ|बजा दो|बजा दे|सुनाओ|play";
  let song = null;
  let m = t.match(new RegExp("^(?:" + playWords + ")\\s+(.+)$", "i"));
  if (m) song = m[1];
  else {
    m = t.match(new RegExp("^(.+?)\\s+(?:" + playWords + ")$", "i"));
    if (m) song = m[1];
  }
  if (song !== null) {
    song = song
      .replace(/(youtube|यूट्यूब|युट्यूब)\s*(पर|par|on)?/ig, '')
      .replace(/\b(यह|ये|इस|वो|वह|the|a|song|video)\b/ig, '')
      .replace(/(गाना|गाने|गीत|वीडियो)\s*(को)?/g, '')
      .replace(/\s+/g, ' ').trim();
    if (!song) {
      output.innerText = "कौन सा गाना चलाऊँ? गाने का नाम बोलें।";
      speak("कौन सा गाना चलाऊँ? गाने का नाम बताइए।");
      return true;
    }
    speak(song + " यूट्यूब पर खोल रही हूँ।");
    openTab("https://www.youtube.com/results?search_query=" + encodeURIComponent(song), "YouTube: " + song);
    return true;
  }

  if (/(youtube|यूट्यूब|युट्यूब)\s*(खोलो|खोल दो|खोल दे|खोलिए|open)|open\s+youtube/i.test(t)) {
    speak("यूट्यूब खोल रही हूँ।");
    openTab("https://www.youtube.com", "YouTube खोला गया");
    return true;
  }

  if (/(google|गूगल)\s*(खोलो|खोल दो|खोल दे|खोलिए|open)|open\s+google/i.test(t)) {
    speak("गूगल खोल रही हूँ।");
    openTab("https://www.google.com", "Google खोला गया");
    return true;
  }
  return false;
}

async function handleAdvancedQuery(text, context) {
  if (tryAutomation(text)) return;

  let m = text.match(/^(?:note|नोट)\s*[:：]?\s*(.+)$/i);
  if (m) {
    userNotes.push(m[1].trim()); save('rika_notes', userNotes); updateUI();
    output.innerText = "📝 Note saved: " + m[1];
    speak("नोट सेव हो गया।");
    return;
  }
  m = text.match(/^(?:alarm|अलार्म)\s*[:：]?\s*(.+)$/i);
  if (m) {
    const v = setAlarmValue(m[1].trim());
    output.innerText = "⏰ Alarm set: " + v;
    speak("अलार्म सेट हो गया है।");
    return;
  }

  if (!GROQ_API_KEY) {
    output.innerText = "Groq API key missing. Tap 'i' in RIKA to add it.";
    speak("कृपया पहले एपिआई की जोड़ें।");
    return;
  }

  output.innerText = "🤔 Thinking...";
  const now = new Date().toLocaleString('en-IN');
  const system = `You are RIKA, a friendly Hindi-speaking voice assistant. Reply briefly in Hindi (Devanagari) unless the user writes in another language. Current time: ${now}. User location: ${userLiveLocation}. User notes: ${userNotes.join(' | ') || 'none'}.`;

  let lastErr = "AI error.";
  for (const model of GROQ_MODELS) {
    try {
      const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${GROQ_API_KEY}` },
        body: JSON.stringify({
          model,
          messages: [{ role: "system", content: system }, ...context, { role: "user", content: text }],
          max_completion_tokens: 1024
        })
      });
      const data = await res.json();
      let reply = data.choices && data.choices[0]?.message?.content;
      if (reply) reply = reply.replace(/<think>[\s\S]*?<\/think>/g, '').trim();
      if (reply) {
        output.innerText = reply;
        addHistory("RIKA: " + reply);
        speak(reply);
        return;
      }
      lastErr = data.error?.message || lastErr;
    } catch (e) { lastErr = e.message; }
  }
  output.innerText = "Error: " + lastErr;
  speak("माफ़ कीजिए, जवाब देने में समस्या हुई।");
}

window.sendTextPrompt = function () {

function runCommand(text) {
  output.innerText = "You: " + text;

    content: h.replace(/^(Q:|RIKA:|RIKA \(Img\):)\s*/, '')

  handleAdvancedQuery(text, context);
}

function compressImage(file, maxSide = 1280, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const scale = Math.min(1, maxSide / Math.max(w, h));
      w = Math.round(w * scale); h = Math.round(h * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("यह इमेज फॉर्मेट पढ़ा नहीं जा सका।")); };
    img.src = url;
  });
}

window.analyzeImage = async function () {
  stopSpeaking();
  const fileInput = document.getElementById('imageInput');
  const scanBtn = document.getElementById('scanBtn');
  const customPrompt = document.getElementById('visionPrompt').value.trim();
  if (!fileInput.files || fileInput.files.length === 0) { alert("कृपया पहले कोई तस्वीर चुनें!"); return; }
  if (!GROQ_API_KEY) { output.innerText = "Groq API key missing. Tap 'i' in RIKA to add it."; speak("कृपया पहले एपिआई की जोड़ें।"); return; }

  scanBtn.disabled = true;
  output.innerText = "📷 Scanning image with Vision AI...";
  speak("तस्वीर की जांच हो रही है।");

  let base64Image;
  try { base64Image = await compressImage(fileInput.files[0]); }
  catch (e) { output.innerText = "Vision Error: " + e.message; speak("तस्वीर समझने में समस्या हुई।"); scanBtn.disabled = false; return; }

  const questionText = customPrompt || "इस तस्वीर में क्या दिख रहा है? संक्षेप में 2 वाक्यों में हिंदी में बताएं।";

  let lastErr = "Vision model error.";
  for (const vModel of VISION_MODELS) {
    try {
      const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${GROQ_API_KEY}` },
        body: JSON.stringify({
          model: vModel,
          messages: [{
            role: "user",
            content: [
              { type: "text", text: questionText },
              { type: "image_url", image_url: { url: base64Image } }
            ]
          }],
          max_completion_tokens: 2048
        })
      });
      const data = await res.json();
      let reply = data.choices && data.choices[0]?.message?.content;
      if (reply) reply = reply.replace(/<think>[\s\S]*?<\/think>/g, '').trim();
      if (reply) {
        output.innerText = "📷 Vision: " + reply;
        addHistory("RIKA (Img): " + reply);
        speak(reply);
        scanBtn.disabled = false;
        return;
      }
      lastErr = data.error?.message || lastErr;
    } catch (e) { lastErr = e.message; }
  }
  output.innerText = "Vision Error: " + lastErr;
  speak("तस्वीर समझने में समस्या हुई।");
  scanBtn.disabled = false;
